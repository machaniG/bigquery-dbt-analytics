# models/marts/inventory/fct_product_performance.yml
version: 2

models:
  - name: fct_prod_performance
    description: >
      Product-level performance mart.

      Grain: one row per product_id.

      Purpose:
      - Identify high-selling, high-return, and high-net-revenue products.
      - Support product return-rate analysis.
      - Provide stable product-level metrics for inventory and merchandising.

      Metric conventions:
      - gross_units_sold includes sale lines only.
      - returned_units is a positive count of returned units.
      - net_units_moved equals gross units sold minus returned units,
        plus any other signed movements.
      - return_rate equals returned_units divided by gross_units_sold.
    columns:
      - name: product_id
        description: "Unique product identifier."
        data_tests:
          - unique
          - not_null

      - name: invoice_count
        description: "Number of distinct invoices containing this product."
        data_tests:
          - not_null

      - name: gross_units_sold
        description: >
          Total units sold in sale transactions.
          Does not subtract returns.
        data_tests:
          - not_null

      - name: returned_units
        description: >
          Total units returned, stored as a positive count.
        data_tests:
          - not_null

      - name: net_units_moved
        description: >
          Net units moved after returns and cancellations.
          Net quantity movement per product
        data_tests:
          - not_null

      - name: gross_sales
        description: >
          Gross sales value before returns and cancellations.
        data_tests:
          - not_null

      - name: net_revenue
        description: >
          Net revenue after returns and cancellations.
        data_tests:
          - not_null

      - name: return_rate
        description: >
          Returned units divided by gross units sold.
          Null when the product has no recorded sales.