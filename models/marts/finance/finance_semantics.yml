# models/marts/finance/finance_semantics.yml
version: 2

models:
  - name: marts_finance
    description: "Semantic model for transaction revenue and refunds."
    config:
      semantic_model:
        enabled: true

    semantic_model:
      name: transaction_lines
      description: "Transaction-line facts used for revenue and refund metrics."
      label: Transaction Lines
      default_aggregation_time_dimension: transaction_date

      entities:
        - name: transaction_line
          type: primary
          expr: transaction_line_id

        - name: transaction
          type: foreign
          expr: transaction_id

        - name: customer
          type: foreign
          expr: customer_id

        - name: product
          type: foreign
          expr: product_id

        - name: store
          type: foreign
          expr: store_id

      dimensions:
        - name: transaction_date
          type: time
          type_params:
            time_granularity: day

        - name: transaction_type
          type: categorical

        - name: currency
          type: categorical

      measures:
        - name: gross_revenue
          description: "Sum of gross transaction-line amounts."
          agg: sum
          expr: signed_line_amount

        - name: units_sold
          description: "Net units sold, with refunds subtracted."
          agg: sum
          expr: signed_quantity

        - name: transaction_line_count
          description: "Number of transaction lines."
          agg: count
          expr: transaction_line_id

      metrics:
        - name: net_revenue
          description: "Net revenue from sales minus refunds."
          label: Net Revenue
          type: simple
          type_params:
            measure: gross_revenue

        - name: net_units_sold
          description: "Net quantity sold after refunds."
          label: Net Units Sold
          type: simple
          type_params:
            measure: units_sold

        - name: transaction_lines
          description: "Count of transaction lines."
          label: Transaction Lines
          type: simple
          type_params:
            measure: transaction_line_count