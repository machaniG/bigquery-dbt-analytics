version: 2

models:
  - name: fct_daily_sales
    description: >
      Daily sales performance by transaction date and country.
      One row per transaction_date and country.
      semantic layer defines daily finance performance metrics including gross sales,
        returns and cancellations, net revenue, and net units moved.

    config:
      materialized: table

    semantic_model:
      enabled: true
      name: daily_sales_semantic_model

    agg_time_dimension: transaction_date

    columns:
      - name: transaction_date
        description: "Business date of the transactions."
        granularity: day
        data_tests:
          - not_null

      - name: country
        description: "Standardized customer country."
        data_tests:
          - not_null

      - name: gross_sales
        description: "Gross sales before returns and cancellations."

      - name: returns_and_cancellations
        description: >
          Financial impact of returns and cancellations.
          Expected to be zero or negative.

      - name: net_revenue
        description: "Revenue after returns and cancellations."

      - name: net_units_moved
        description: >
          Net units sold after returns and cancellations.
          Net quantity movement per day and country

    metrics:
      - name: gross_sales
        description: "Gross sales before returns and cancellations."
        label: Gross Sales
        type: simple
        agg: sum
        expr: gross_sales

      - name: returns_and_cancellations
        description: "Returns and cancellations; expected to be zero or negative."
        label: Returns and Cancellations
        type: simple
        agg: sum
        expr: returns_and_cancellations

      - name: net_revenue
        description: "Net revenue after returns and cancellations."
        label: Net Revenue
        type: simple
        agg: sum
        expr: net_revenue

      - name: daily_net_units_moved
        description: "Net units sold after returns and cancellations 
          aggregated by transaction date and country."
        label: Daily Net Units Moved
        type: simple
        agg: sum
        expr: net_units_moved

      - name: return_and_cancellation_rate
        description: >
          Absolute value of returns and cancellations divided by gross sales.
          A higher value means a larger share of sold value was reversed.
        label: Return and Cancellation Rate
        type: ratio
        numerator:
          name: returns_and_cancellations
          filter: "{{ Metric('returns_and_cancellations') }} < 0"
          alias: absolute_returns_and_cancellations
        denominator:
          name: gross_sales