# models/marts/finance/daily_sales_schema.yml

version: 2

models:
  - name: fct_daily_sales
    description: >
      Daily sales tracking mart for the Finance team.

      Grain: one row per transaction_date and country.

      Purpose:
      - Track daily gross sales, returns/cancellations, net revenue,
        and net units moved.
      - Support time-series and country-level reporting.

      Metric conventions:
      - gross_sales includes only sale transaction lines.
      - returns_and_cancellations is zero or negative.
      - net_revenue equals gross_sales plus returns_and_cancellations.
      - net_units_moved equals sales minus returns and cancellations.
    columns:
      - name: transaction_date
        description: "Business date of the transactions."
        data_tests:
          - not_null

      - name: country
        description: "Standardized customer country."
        data_tests:
          - not_null

      - name: gross_sales
        description: >
          Sum of gross_line_amount for sale transaction lines only.
          Excludes returns and cancellations.
        data_tests:
          - not_null

      - name: returns_and_cancellations
        description: >
          Sum of signed_line_amount for return and cancellation lines.
          Expected to be zero or negative.

      - name: net_revenue
        description: >
          Revenue after returns and cancellations.
          Equivalent to sum(signed_line_amount) across all transaction lines.
        data_tests:
          - not_null

      - name: net_units_moved
        description: >
          Net units sold after returns and cancellations.
          Equivalent to sum(signed_quantity) across all transaction lines.
        data_tests:
          - not_null