# models/semantic_layer/customer_semantics.yml
# Customer semantic model
# Attached to marts_customers, which has one row per customer_id

version: 2

models:
  - name: marts_customers
    description: >
      Customer-level lifetime transaction metrics.
      One row per customer.
    config:
      semantic_model:
        enabled: true
        name: customers
        label: Customers
        description: >
          Customer attributes, Customer lifetime value and transaction metrics.
        default_agg_time_dimension: first_transaction_date

    columns:
      - name: customer_id
        description: "Unique customer identifier."
        entity:
          name: customer
          type: primary

      - name: first_transaction_date
        description: "Date of the customer's earliest transaction."
        granularity: day
        dimension:
          type: time

      - name: last_transaction_date
        description: "Date of the customer's most recent transaction."
        granularity: day
        dimension:
          type: time

      - name: lifetime_net_amount
        description: "Lifetime net transaction amount."
        metrics:
          - name: customer_lifetime_value
            description: "Lifetime net transaction amount per customer."
            label: Customer Lifetime Value
            type: simple
            agg: sum

      - name: lifetime_transaction_count
        description: "Count of distinct invoices associated with the customer."
        metrics:
          - name: customer_transaction_count
            description: "Count of distinct invoices associated with the customer."
            label: Customer Transaction Count
            type: simple
            agg: sum