# models/semantic_layer/inventory_semantics.yml
# Attached to fct_product_performance which has one row per product_id
# The product primary entity allows this semantic model to join cleanly with other product-related semantic models in the future.
# Entities define the graph edges that MetricFlow uses to infer joins.

version: 2

models:
  - name: fct_prod_performance
    description: >
      Product-level performance including sales, returns,
      net movement, revenue, and return rate.
      One row per product_id.
    config:
      semantic_model:
        enabled: true
        name: product_performance
        label: Product Performance
        description: >
          Product-level performance metrics for inventory and merchandising.
        default_agg_time_dimension: first_transaction_date

    columns:
      - name: product_id
        description: "Unique product identifier."
        entity:
          name: product
          type: primary

      - name: first_transaction_date
        description: "Earliest transaction date for the product."
        granularity: day
        dimension:
          type: time

      - name: last_transaction_date
        description: "Latest transaction date for the product."
        granularity: day
        dimension:
          type: time

      - name: gross_units_sold
        description: "Units sold in sale transactions."
        metrics:
          - name: gross_units_sold
            description: "Units sold in sale transactions."
            label: Gross Units Sold
            type: simple
            agg: sum

      - name: returned_units
        description: "Units returned, stored as a positive count."
        metrics:
          - name: returned_units
            description: "Units returned."
            label: Returned Units
            type: simple
            agg: sum

      - name: net_units_moved
        description: "Net units moved after returns and cancellations."
        metrics:
          - name: net_units_moved
            description: "Net units moved after returns and cancellations."
            label: Net Units Moved
            type: simple
            agg: sum

      - name: net_revenue
        description: "Net revenue after returns and cancellations."
        metrics:
          - name: net_revenue
            description: "Net revenue after returns and cancellations."
            label: Net Revenue
            type: simple
            agg: sum