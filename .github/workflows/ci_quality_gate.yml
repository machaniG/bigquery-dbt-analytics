# .github/workflows/ci_quality_gate.yml 
#Every time i push code or open a pull request, GitHub Actions will automatically validate my Terraform, 
#run my Ingestion Chaos Tests, verify my dbt SQL models, and run my AI Reliability & Hallucination Gate

name: Data & AI Reliability Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  terraform-validate:
    name: 1. Terraform Validate & Format Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/envs/gcp
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.0
      - name: Check Terraform Formatting
        run: terraform fmt -check
      - name: Terraform Init (No Backend)
        run: terraform init -backend=false
      - name: Terraform Validate
        run: terraform validate

  ingestion-quality-tests:
    name: 2. Ingestion & Pandera Chaos Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ingestion
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ingestion Dependencies
        run: |
          pip install --upgrade pip
          pip install pandas pyarrow pandera google-cloud-storage pytest
      - name: Run Pandera Schema & Chaos Tests
        run: pytest -v

  ai-reliability-gate:
    name: 3. AI Hallucination & Policy Evaluation Gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai_eval
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install AI Eval Dependencies
        run: |
          pip install --upgrade pip
          pip install google-cloud-bigquery google-genai pydantic pytest
      - name: Run Deterministic Faithfulness & Non-Response Tests
        run: pytest -v
