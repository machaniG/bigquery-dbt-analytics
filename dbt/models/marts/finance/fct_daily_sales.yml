#models/marts/finance/fct_daily_sales.yml
# for daily inventory tracking dashboard
version: 2

models:
  - name: fct_daily_sales
    description: >
      Daily sales performance by transaction date and country.
      One row per transaction_date and country.
      Semantic layer defines daily finance performance metrics including gross sales,
      returns and cancellations, net revenue, and net units moved.

    config:
      materialized: table
      # added contract: {enforced: true} with explicit data_type definitions. 
      # this guarantees BigQuery will fail the build rather than silently break Looker Studio 
      #or downstream AI models if a column type or name ever shifts
      contract:
        enforced: true #enforcing dbt model contracts 

    # add elementary anomaly detection tests for the metrics
    data_tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: transaction_date
            time_bucket:
              period: day
              count: 1
      - elementary.schema_changes:
          config:
            severity: warn

    # add semantic model definition for BI tools and AI consumption. 
    # this semantic model defines the metrics and dimensions for the fct_daily_sales model
    semantic_model:
      enabled: true
      name: daily_sales_semantic_model
    
    agg_time_dimension: transaction_date

    # Composite primary entity goes under derived_semantics
    derived_semantics:
      entities:
        - name: daily_country_sales
          type: primary
          expr: "concat(cast(transaction_date as string), '-', coalesce(country, 'unknown'))"


    columns:               
      - name: transaction_date
        description: "Business date of the transactions."
        granularity: day
        data_type: date
        dimension:
          type: time
        data_tests:
          - not_null

      - name: country
        description: "Standardized customer country."
        data_type: string
        dimension:
          type: categorical
        data_tests:
          - not_null

      - name: gross_sales
        description: "Gross sales before returns and cancellations."
        data_type: numeric(38, 9)

      - name: returns_and_cancellations
        description: >
          Financial impact of returns and cancellations.
          Expected to be zero or negative.
        data_type: numeric(38, 9)

      - name: net_revenue
        description: "Revenue after returns and cancellations."
        data_type: numeric(38, 9)

      - name: net_units_moved
        description: >
          Net units sold after returns and cancellations.
          Net quantity movement per day and country.
        data_type: integer

      - name: invoice_count
        data_type: int64
      - name: known_customer_count
        data_type: int64

    metrics:
      - name: gross_sales
        description: "Gross sales before returns and cancellations."
        label: Gross Sales
        type: simple
        agg: sum
        expr: gross_sales

      - name: returns_and_cancellations
        description: "Returns and cancellations; expected to be zero or negative."
        label: Returns and Cancellations
        type: simple
        agg: sum
        expr: returns_and_cancellations

      - name: absolute_returns_and_cancellations
        description: >
          Absolute financial value of returns and cancellations.
          Useful as the numerator for the return and cancellation rate.
        label: Absolute Returns and Cancellations
        type: derived
        input_metrics:
          - name: returns_and_cancellations
        expr: "abs(returns_and_cancellations)"

      - name: net_revenue
        description: "Net revenue after returns and cancellations."
        label: Net Revenue
        type: simple
        agg: sum
        expr: net_revenue

      - name: daily_net_units_moved
        description: >
          Net units sold after returns and cancellations,
          aggregated by transaction date and country.
        label: Daily Net Units Moved
        type: simple
        agg: sum
        expr: net_units_moved

      - name: return_and_cancellation_rate
        description: >
          Absolute value of returns and cancellations divided by gross sales.
          A higher value means a larger share of sold value was reversed.
        label: Return and Cancellation Rate
        type: ratio
        numerator:
          name: absolute_returns_and_cancellations
          alias: absolute_returns_and_cancellations
        denominator:
          name: gross_sales
