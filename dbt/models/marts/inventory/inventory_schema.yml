version: 2

models:
  - name: marts_inventory
    description: >
      Product movement fact for inventory analytics.

      Grain: one row per invoice-product-line occurrence.

      signed_quantity is positive for sales and negative for
      returns and cancellations.
      Includes product movement semantic model for units sold, units returned,
        net inventory movement, and movement counts.

    config:
      materialized: incremental
      incremental_strategy: merge
      unique_key: transaction_line_id
      on_schema_change: append_new_columns
      #add partitioning to improve query performance and reduce cost for large tables
      partition_by:
        field: transaction_date
        data_type: date
        granuarity: day

      # added contract: {enforced: true} with explicit data_type definitions. 
      #This guarantees BigQuery will fail the build rather than silently break Looker Studio 
      #or downstream AI models if a column type or name ever shifts
      contract:
        enforced: true

    semantic_model:
      enabled: true
      name: product_movements_semantic_model
    agg_time_dimension: transaction_date

        # Model-level Elementary Observability Tests
        # elementary's automated anomaly detection: volume and freshness monitoring to catch silent pipeline failures 
        # or unexpected changes in data volume, schema, or freshness. 
    data_tests:
      - elementary.volume_anomalies:
          arguments:
            timestamp_column: transaction_date
            time_bucket:
              period: day
              count: 1
      - elementary.schema_changes:
          config:
            severity: warn
  

    columns:
      - name: transaction_line_id
        description: "Deterministic surrogate key for one invoice-product line."
        entity:
          type: primary
          name: product_movement
        data_type: string
        data_tests:
          - unique
          - not_null

      - name: invoice_id
        description: >
          Invoice identifier. Not unique at line level.
        entity:
          type: foreign
          name: invoice
        data_type: string
        data_tests:
          - not_null

      - name: product_id
        description: "Product identifier."
        entity:
          type: foreign
          name: product
        data_type: string
        data_tests:
          - not_null

      - name: transaction_date
        description: "Business date of the movement."
        granularity: day
        data_type: date
        dimension:
          type: time
        data_tests:
          - not_null

      - name: transaction_type
        description: "Sale, return, cancellation, or unknown."
        dimension:
          type: categorical
        data_type: string
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['sale', 'return', 'cancellation', 'adjustment', 'unknown']
              config:
                severity: warn

      - name: quantity
        description: >
          Raw source quantity; may be negative for returns/cancellations.
        data_type: integer
        data_tests:
          - not_null

      - name: signed_quantity
        description: >
          Net inventory impact: positive for sales,
          negative for returns and cancellations.
        
        data_type: integer
        data_tests:
          - not_null

      - name: country
        description: "Customer or transaction country."
        dimension:
          type: categorical
        data_type: string

      - name: gross_line_amount
        description: >
          Recorded line value before applying return/cancellation direction. Filter to sales for gross sales.
          It preserves the value exactly as calculated from the source fields. 
          It does not yet decide whether the row should count positively or negatively in revenue.
        
        data_type: numeric
        data_tests:
          - not_null

      - name: signed_line_amount
        description: >
          Line value after applying negative sign for returns/cancellations. used for Net revenue, returns, cancellations
          Financial impact: positive for sales,
          negative for returns and cancellations.
          Summing this column yields net revenue.
        data_type: numeric
        data_tests:
          - not_null

      - name: product_description
        description: >
          Most recent non-null product description observed in transactions.
          The UCI source may contain inconsistent descriptions for the same
          product code.
        data_type: string
    

    metrics:
      - name: units_sold
        label: Units Sold
        description: "Positive units moved by sales."
        type: simple
        agg: sum
        expr: >
          case
            when transaction_type = 'sale'
              then signed_quantity
            else 0
          end

      - name: units_returned
        label: Units Returned
        description: >
          Absolute units removed by returns and cancellations.
          Returned as a positive number for easier dashboard display.
        type: simple
        agg: sum
        expr: >
          case
            when transaction_type in ('return', 'cancellation')
              then abs(signed_quantity)
            else 0
          end

      - name: product_net_units_moved
        label: Product Net Units Sold
        description: >
          Net inventory movement after returns and cancellations,
          aggregated by product.
          Positive for net sales; negative for net reversals.
        type: simple
        agg: sum
        expr: signed_quantity

      - name: product_movement_count
        label: Product Movement Count
        description: "Number of invoice-product-line movements."
        type: simple
        agg: count
        expr: transaction_line_id

      - name: distinct_products_moved
        label: Distinct Products Moved
        description: "Number of distinct products with at least one movement."
        type: simple
        agg: count_distinct
        expr: product_id