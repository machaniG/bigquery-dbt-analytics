# profiles/profiles.prod.yml
online_retail:
  target: "{{ env_var('DBT_TARGET') }}"

  outputs:
    dev:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET') }}"
      location: "{{ env_var('BQ_LOCATION') }}"
      threads: 8

    prod:
      type: bigquery
      method: oauth
      project: "{{ env_var('GCP_PROJECT_ID') }}"
      dataset: "{{ env_var('DBT_DATASET') }}"
      location: "{{ env_var('BQ_LOCATION') }}"
      threads: 8